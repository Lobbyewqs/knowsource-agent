<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知源 · 知识库问答</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">知</span><div><strong>知源</strong><small>KnowSource</small></div></div><button class="new-chat" id="clear">＋ 新建对话</button><div class="side-label">知识空间 <span>KNOWLEDGE</span></div><div id="libraries" class="libraries" aria-label="选择知识库"></div><div class="side-bottom"><span class="status-dot"></span> 本地知识库 <p>让每一次回答都有据可查。</p></div></aside>
<main class="main"><header><div><span class="header-caption">知识库问答</span><h1 id="library-title">正在加载知识库</h1></div><span class="header-tag"><span class="status-dot"></span> 本地运行</span></header><section class="conversation" id="conversation" aria-live="polite"><div class="welcome" id="welcome"><div class="seal">知</div><p class="welcome-label">你的知识，清晰可见</p><h2>今天想了解什么？</h2><p class="intro">从知识库中查找答案，追溯每一条参考来源。<br>也可以继续追问，让问题更完整。</p><div class="suggestions"><button data-question="这个知识库包含哪些内容？"><span>探索知识库</span><b>这个知识库包含哪些内容？</b></button><button data-question="请总结其中的重要信息。"><span>快速了解</span><b>请总结其中的重要信息。</b></button><button data-question="资料更新后应该怎么做？"><span>开始提问</span><b>资料更新后应该怎么做？</b></button></div></div><div id="messages" class="messages"></div></section><div class="composer-wrap"><form id="chat-form" class="composer"><label for="question" class="sr-only">输入问题</label><textarea id="question" rows="2" maxlength="4000" placeholder="输入你的问题，按 Enter 发送…"></textarea><div class="composer-footer"><span id="hint">回答基于当前知识库内容</span><button id="send" type="submit" aria-label="发送问题">发送 <span>↑</span></button></div></form><p class="disclaimer">回答由 AI 生成，请结合来源核实重要信息。</p></div></main></div><script src="/app.js"></script></body></html>
